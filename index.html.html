<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>終末世界</title>
<meta name="application-name" content="終末世界">
<meta name="theme-color" content="#14120f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="終末世界">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="終末世界サバイバル・文明再建ゲーム">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  /* ===== UI刷新 =====
     旧文明のPDA(蛍光グリーン・走査線)の世界観はそのまま、パネル・ボタン・文字の大きさと余白をそろえて見やすくした。
     色や角丸は :root の変数でそろえてある。(ゲームの動きは変えていない) */
  :root { --bg:#14120f; --pda-green:#7CFF9B; --pda-amber:#FFB000; --ink:#d9f7e1; --dim:#8db79a; --line:rgba(124,255,155,.28); --line-strong:rgba(124,255,155,.7);
          --panel:rgba(9,17,13,.84); --panel-solid:rgba(9,17,13,.94); --danger:#ff6b6b; --radius:10px;
          --scan:repeating-linear-gradient(0deg, rgba(0,0,0,.20) 0 1px, transparent 1px 3px);
          --ui:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
          --mono:ui-monospace,Menlo,Consolas,monospace;
          /* レイヤー(z-index)・文字・操作の大きさを1か所で決める */
          --z-fx:5; --z-hud:10; --z-stick:12; --z-ctl:20; --z-map:22; --z-bar:25; --z-menu:30; --z-sheet:35; --z-notice:38; --z-death:40; --z-modal:50;
          --fs-s:12px; --fs-m:13px; --fs-l:15px; --h-ctl:44px; --gap:8px;
          --sa-t:env(safe-area-inset-top,0px); --sa-b:env(safe-area-inset-bottom,0px); --sa-l:env(safe-area-inset-left,0px); --sa-r:env(safe-area-inset-right,0px);
          box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#14120f; } }
  :root[data-theme="dark"] { --bg:#14120f; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); display:flex; align-items:center; justify-content:center; overflow:hidden; font-family:var(--ui); }
  canvas { image-rendering:pixelated; image-rendering:crisp-edges; display:block; }
  html, body { touch-action:none; overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .px { width:24px; height:24px; image-rendering:pixelated; image-rendering:crisp-edges; display:block; flex:none; pointer-events:none; }
  .px.s { width:12px; height:12px; }
  svg.ic { width:1em; height:1em; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  svg.ic.sol { fill:currentColor; stroke:none; }

  /* --- 共通のパネルとボタン --- */
  #hud, #menu, #placeBar, #npcBar, #chestBar, #boneBar { background:var(--scan), var(--panel); border:1px solid var(--line); border-radius:var(--radius);
        box-shadow:0 6px 20px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.03); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); color:var(--ink); font:13px/1.5 var(--ui); }
  #npcBar button, #chestBar button, #boneBar button, #rotBtn, #placeCancel {
        min-height:var(--h-ctl); padding:8px 14px; font:600 13px/1.2 var(--ui); color:var(--ink); background:rgba(124,255,155,.14); border:1px solid var(--line-strong);
        border-radius:8px; cursor:pointer; transition:background .12s, transform .12s; }
  #npcBar button:active, #chestBar button:active, #boneBar button:active, #rotBtn:active { background:rgba(124,255,155,.42); transform:scale(.97); }
  #placeCancel { color:#ffd6d6; background:rgba(230,57,70,.2); border-color:rgba(255,107,107,.7); }
  #placeCancel:active { background:rgba(230,57,70,.5); transform:scale(.97); }
  #rotBtn { display:none; }

  #soundBtn { position:fixed; z-index:var(--z-ctl); top:calc(var(--sa-t) + 8px); right:calc(var(--sa-r) + 8px); min-height:34px; padding:5px 9px; border:1px solid rgba(255,210,120,.55); border-radius:8px; color:#ffe6a6; background:rgba(15,13,12,.78); font:700 11px/1 var(--ui); box-shadow:0 3px 10px rgba(0,0,0,.35); }
  #soundBtn[aria-pressed="false"] { color:#a9aaa5; border-color:rgba(180,180,180,.35); }
  /* --- HUD(体力・空腹・渇き) --- */
  #civHud { position:fixed; z-index:var(--z-hud); top:calc(var(--sa-t) + 8px); right:calc(var(--sa-r) + 8px); max-width:210px; box-sizing:border-box; padding:7px 9px; display:none; pointer-events:none; color:var(--ink); background:rgba(9,17,13,.66); border:1px solid rgba(217,201,163,.28); border-radius:8px; font:700 12px/1.45 var(--ui); text-shadow:0 1px 2px #000; white-space:pre-line; }
  #civHud .cb { height:6px; margin:3px 0 2px; background:rgba(0,0,0,.6); border:1px solid rgba(255,210,74,.4); border-radius:3px; overflow:hidden; }
  #civHud .cb i { display:block; height:100%; background:linear-gradient(90deg,#d99a2f,#ffd24a); }
  #civHud { right:calc(var(--sa-r) + 38px); max-width:236px; padding:8px 10px; font-size:12px; white-space:normal; }
  #civHud .t { font-size:14px; color:#fff0c8; }
  #civHud .pips { margin:3px 0 4px; display:flex; flex-wrap:wrap; gap:3px; }
  #civHud .pp { display:inline-block; width:20px; height:16px; line-height:16px; text-align:center; font-size:11px; border-radius:3px; background:rgba(0,0,0,.55); border:1px solid rgba(255,210,74,.35); color:#9a8f78; }
  #civHud .pp.on { background:#d99a2f; border-color:#ffd24a; color:#2a1c06; }
  #civHud .nx { color:#cfd8c0; font-weight:600; margin-bottom:2px; }
  #civHud .goal { margin-top:6px; padding:5px 7px; border-radius:6px; background:rgba(255,210,74,.14); border:1px solid rgba(255,210,74,.55); color:#fff3c4; }
  #civHud .goal .gh { display:block; color:#ffd24a; font-size:11px; }
  #civHud .goal .gd { color:#ffd24a; white-space:nowrap; }
  #civHud .goal .gs { display:block; margin-top:2px; font-weight:500; font-size:11px; color:#d9d2bd; }
  #civHud.compact .nx, #civHud.compact .ok, #civHud.compact .ng, #civHud.compact .cb, #civHud.compact .gs { display:none; }
  #civHud.compact { padding:6px 9px; } #civHud.compact .goal { margin-top:4px; }
  #civHud .ok { color:#8fe08f; } #civHud .ng { color:#ffb0a0; } #civHud .me { color:#ffd24a; }
  #hud { position:fixed; z-index:var(--z-hud); top:calc(var(--sa-t) + 8px); left:calc(var(--sa-l) + 8px); pointer-events:none; padding:8px 10px; transition:opacity .6s; font:12px/1 var(--mono); }
  #hud .row { display:flex; align-items:center; gap:7px; margin-bottom:6px; }
  #hud .row:nth-child(3) { margin-bottom:5px; }
  #worldHud { display:flex; align-items:center; gap:3px; min-height:18px; padding:4px 6px; box-sizing:border-box; color:var(--ink); background:rgba(9,17,13,.62); border:1px solid rgba(217,201,163,.22); border-radius:6px; font:700 12px/1 var(--ui); letter-spacing:.03em; text-shadow:0 1px 2px #000; }
  #worldHud .sep { color:var(--dim); }
  #hud .lbl { width:2.4em; color:var(--dim); letter-spacing:.04em; }
  #hud .bar { width:76px; height:8px; background:rgba(0,0,0,.6); border:1px solid rgba(124,255,155,.35); border-radius:4px; overflow:hidden; }
  #hud .fill { height:100%; width:100%; border-radius:3px; box-shadow:inset 0 1px 0 rgba(255,255,255,.28); transition:width .25s; }
  #hud .val { width:2.2em; text-align:right; color:var(--ink); }
  #hud .row.low .val { color:var(--danger); }
  #hud .row.low .bar { border-color:rgba(255,107,107,.8); animation:lowPulse 1s ease-in-out infinite; }
  @keyframes lowPulse { 50% { box-shadow:0 0 6px rgba(255,107,107,.8); } }
  #hud .warn { display:none; margin-top:8px; padding-top:6px; border-top:1px solid var(--line); color:var(--pda-amber); font:12px/1.5 var(--ui); text-shadow:0 0 2px #000; }

  /* --- 右下のアクションボタン --- */
  #menuBtn { position:fixed; z-index:var(--z-ctl); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; cursor:pointer; color:var(--ink); font:700 11px/1 var(--ui);
                      -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:none; transition:transform .1s, background .12s, box-shadow .12s; }
  #menuBtn { right:calc(var(--sa-r) + 12px); bottom:calc(var(--sa-b) + 12px); width:58px; height:58px; font-size:12px; border-radius:16px;
             background:var(--scan), var(--panel-solid); border:1px solid var(--line-strong); box-shadow:0 4px 14px rgba(0,0,0,.5); }
  #menuBtn:active { transform:scale(.94); background:rgba(124,255,155,.3); }
  /* 右下の丸い「叩く」ボタンは廃止。操作は右端スワイプの「操作を選ぶ」(#actSheet)へ */
  /* --- 左下の簡易マップ --- */
  #mapBtn { position:fixed; z-index:var(--z-ctl); left:calc(var(--sa-l) + 12px); bottom:calc(var(--sa-b) + 12px); width:52px; height:52px; border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; cursor:pointer;
            color:var(--ink); font:700 12px/1 var(--ui); background:var(--scan), var(--panel-solid); border:1px solid var(--line-strong); box-shadow:0 4px 14px rgba(0,0,0,.5);
            -webkit-tap-highlight-color:transparent; touch-action:none; transition:transform .1s, background .12s; }
  #mapBtn:active { transform:scale(.94); background:rgba(124,255,155,.3); }
  #mapBtn.on { background:rgba(124,255,155,.22); border-color:var(--pda-green); }
  #mapBox { position:fixed; z-index:var(--z-map); left:calc(var(--sa-l) + 12px); bottom:calc(var(--sa-b) + 72px); display:none; padding:6px; background:var(--scan), var(--panel); border:1px solid var(--line); border-radius:var(--radius);
            box-shadow:0 6px 20px rgba(0,0,0,.45); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
  #mapCv { display:block; width:min(204px, 56vw); height:auto; image-rendering:auto; border-radius:6px; }

  /* --- メニュー(持ち物・作る・情報) --- */
  #menu { position:fixed; z-index:var(--z-menu); right:calc(var(--sa-r) + 12px); bottom:calc(var(--sa-b) + 84px); display:none; width:min(300px, calc(100vw - 24px)); max-height:calc(100vh - 215px); max-height:calc(100dvh - 215px - var(--sa-b) - var(--sa-t));
          overscroll-behavior:contain;
          overflow-y:auto; touch-action:pan-y; box-sizing:border-box; padding:10px; background:var(--scan), var(--panel-solid); }
  #menu::-webkit-scrollbar { width:6px; } #menu::-webkit-scrollbar-thumb { background:rgba(124,255,155,.3); border-radius:3px; }
  #menu .tabs { display:flex; gap:2px; padding:3px; margin-bottom:10px; background:rgba(0,0,0,.4); border-radius:9px; }
  #menu .tab { flex:1; min-height:var(--h-ctl); padding:8px 4px; font:700 13px/1 var(--ui); color:var(--dim); background:transparent; border:0; border-radius:7px; cursor:pointer; transition:background .12s,color .12s; }
  #menu .tab.on { background:var(--pda-green); color:#06210f; }
  #menu .empty { color:var(--dim); padding:14px 4px; text-align:center; }
  #menu .inv { white-space:normal; }
  #menu .inv .item { display:flex; align-items:center; gap:9px; min-height:var(--h-ctl); padding:8px 10px; margin-bottom:5px; border:1px solid var(--line); border-radius:9px; background:rgba(255,255,255,.03); }
  #menu .inv .item .px { background:rgba(0,0,0,.3); border-radius:6px; padding:3px; box-sizing:content-box; }
  #menu .inv .item.on { border-color:var(--pda-amber); background:rgba(255,176,0,.10); }
  #menu .inv .item .act.eq { color:#2a1802; background:var(--pda-amber); }
  #menu .inv .item .nm { flex:1; font-weight:600; }
  #menu .inv .item .ct { font:700 12px/1 var(--mono); color:var(--pda-green); background:rgba(0,0,0,.4); padding:3px 7px; border-radius:6px; }
  #menu .inv .item .act { font:700 12px/1 var(--ui); color:#06210f; background:var(--pda-green); padding:6px 9px; border-radius:6px; }
  #menu .inv .item.edible { cursor:pointer; background:rgba(124,255,155,.10); border-color:var(--line-strong); transition:background .12s, transform .12s; }
  #menu .inv .item.edible:active { background:rgba(124,255,155,.38); transform:scale(.98); }
  #paneInfo { display:none; white-space:pre-line; line-height:1.65; font-size:13px; }
  #paneInfo > div { padding:7px 2px; border-bottom:1px solid rgba(124,255,155,.12); }
  #paneInfo > div:last-child { border-bottom:0; }
  #paneInfo .k { display:block; margin-bottom:1px; color:var(--pda-amber); font:700 12px/1.4 var(--ui); letter-spacing:.04em; }
  /* 「作る」画面のデザイン刷新(PDA風はそのまま。カード・材料チップ・ゲージ・分類見出し) */
  #craftPanel { display:none; }
  #craftPanel .title { display:none; }
  #craftPanel img.px { image-rendering:pixelated; image-rendering:crisp-edges; }
  #craftPanel .heads { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:8px; }
  #craftPanel .hd { padding:8px 9px 9px; border:1px solid rgba(255,176,0,.35); border-radius:9px; background:rgba(255,176,0,.08); }
  #craftPanel .hd.civ { border-color:rgba(124,255,155,.35); background:rgba(124,255,155,.07); }
  #craftPanel .hd .t { display:flex; justify-content:space-between; align-items:baseline; font:700 12px/1 var(--ui); color:var(--dim); letter-spacing:.04em; }
  #craftPanel .hd .v { margin-top:5px; font:800 15px/1 var(--ui); color:var(--pda-amber); }
  #craftPanel .hd.civ .v { color:var(--pda-green); }
  #craftPanel .hd .v small { font:700 12px/1 var(--ui); color:var(--dim); margin-left:4px; }
  #craftPanel .bar { height:5px; margin-top:7px; border-radius:3px; background:rgba(0,0,0,.45); overflow:hidden; }
  #craftPanel .bar i { display:block; height:100%; border-radius:3px; background:var(--pda-amber); }
  #craftPanel .hd.civ .bar i { background:var(--pda-green); }
  #craftPanel .civnext { margin:-2px 2px 8px; font-size:12px; color:var(--dim); white-space:normal; }
  #craftPanel .filters { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:0 0 6px; }
  #craftPanel .filters .cnt { margin-left:auto; font:700 12px/1 var(--ui); color:var(--dim); }
  #craftPanel .cfilter, #craftPanel .ccat { display:inline-flex; align-items:center; min-height:40px; box-sizing:border-box; padding:0 13px; font:700 12px/1 var(--ui); color:var(--dim); border:1px solid var(--line); border-radius:99px; cursor:pointer; background:rgba(0,0,0,.25); }
  #craftPanel .cfilter.on, #craftPanel .ccat.on { color:#06210f; background:var(--pda-green); border-color:var(--pda-green); }
  #craftPanel .sec { display:flex; align-items:center; gap:8px; margin:12px 2px 6px; font:800 12px/1 var(--ui); color:var(--pda-amber); letter-spacing:.08em; }
  #craftPanel .sec::after { content:''; flex:1; height:1px; background:linear-gradient(90deg, rgba(255,176,0,.45), transparent); }
  #craftPanel .sec.civ { color:var(--pda-green); } #craftPanel .sec.civ::after { background:linear-gradient(90deg, rgba(124,255,155,.45), transparent); }
  #craftPanel .craft-row { position:relative; display:flex; align-items:center; gap:10px; min-height:var(--h-ctl); padding:9px 10px 9px 12px; margin-bottom:6px; border:1px solid var(--line-strong); border-radius:11px; overflow:hidden;
                           background:linear-gradient(100deg, rgba(124,255,155,.16), rgba(124,255,155,.05)); cursor:pointer; white-space:normal; transition:background .12s, transform .12s, box-shadow .12s; box-shadow:0 0 10px rgba(124,255,155,.10); }
  #craftPanel .craft-row::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--pda-green); }
  #craftPanel .craft-row .tile { flex:none; display:flex; align-items:center; justify-content:center; width:46px; height:46px; border-radius:9px; background:rgba(0,0,0,.42); border:1px solid rgba(124,255,155,.35); }
  #craftPanel .craft-row .tile img { width:36px; height:36px; }
  #craftPanel .craft-row .tile .sw { width:22px; height:22px; border-radius:5px; border:2px solid rgba(0,0,0,.5); }
  #craftPanel .craft-row .body { flex:1; min-width:0; }
  #craftPanel .craft-row .gv { display:flex; align-items:baseline; gap:6px; font:800 14px/1.2 var(--ui); color:var(--ink); }
  #craftPanel .craft-row .gv em { font:800 11px/1 var(--mono); font-style:normal; color:var(--pda-green); }
  #craftPanel .chips { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
  #craftPanel .chip { display:inline-flex; align-items:center; gap:4px; padding:2px 6px 2px 3px; border-radius:6px; background:rgba(0,0,0,.4); border:1px solid rgba(124,255,155,.25); font:700 11px/1.1 var(--mono); color:var(--pda-green); }
  #craftPanel .chip img { width:12px; height:12px; } #craftPanel .chip .sw { width:10px; height:10px; border-radius:2px; margin:0 1px; border:1px solid rgba(0,0,0,.5); }
  #craftPanel .chip.short { color:var(--danger); border-color:rgba(255,107,107,.45); }
  #craftPanel .craft-row .go { flex:none; padding:12px 12px; border-radius:7px; font:800 13px/1 var(--ui); color:#06210f; background:var(--pda-green); letter-spacing:.06em; }
  #craftPanel .craft-row .lk { margin-top:6px; font:700 12px/1.3 var(--ui); color:var(--pda-amber); }
  #craftPanel .craft-row.off { cursor:default; border-color:var(--line); background:rgba(255,255,255,.025); box-shadow:none; }
  #craftPanel .craft-row.off::before { background:rgba(255,255,255,.12); }
  #craftPanel .craft-row.off .tile { opacity:.5; filter:grayscale(.5); border-color:var(--line); }
  #craftPanel .craft-row.off .gv { color:var(--dim); } #craftPanel .craft-row.off .gv em { color:var(--dim); }
  #craftPanel .craft-row:not(.off):active { background:rgba(124,255,155,.38); transform:scale(.98); }
  #craftPanel .craft-row.pop { animation:craftpop .5s ease-out; }
  @keyframes craftpop { 0% { box-shadow:0 0 0 0 rgba(124,255,155,.9); background:rgba(124,255,155,.55); } 100% { box-shadow:0 0 0 14px rgba(124,255,155,0); } }
  #craftPanel .none { padding:18px 6px; text-align:center; color:var(--dim); }

  /* --- 画面下のパネル(置く・NPC・倉庫) --- */
  #placeBar, #npcBar, #chestBar, #boneBar { position:fixed; z-index:var(--z-bar); left:50%; transform:translateX(-50%); display:none; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center;
                                  width:max-content; box-sizing:border-box; padding:9px 12px; }
  #placeBar { bottom:calc(var(--sa-b) + 14px); max-width:calc(100vw - 160px); }
  #npcBar, #chestBar, #boneBar { bottom:calc(var(--sa-b) + 84px); max-width:calc(100vw - 16px); max-height:calc(100vh - 200px); max-height:calc(100dvh - 200px - var(--sa-t)); overflow-y:auto; overscroll-behavior:contain; touch-action:pan-y; }
  #placeMsg, #npcMsg, #chestMsg, #boneMsg { white-space:pre-line; font-weight:600; }
  #chestMsg { color:var(--pda-amber); }
  /* --- 倉庫: 左に持ち物・右に倉庫の2列。個数(1 / 10 / 全部)を選んで出し入れする --- */
  #chestBar { flex-direction:column; align-items:stretch; flex-wrap:nowrap; justify-content:flex-start; gap:8px; width:min(560px, calc(100vw - 16px)); padding:10px; overflow:hidden; }
  #chestBar .chHead { display:flex; align-items:center; gap:10px; }
  #chestBar #chestMsg { font:800 15px/1 var(--ui); letter-spacing:.08em; }
  #chestBar #chestSum { flex:1; min-width:0; font:700 12px/1.3 var(--ui); color:var(--dim); }
  #chestBar #chestClose { flex:none; width:var(--h-ctl); min-width:var(--h-ctl); padding:0; color:#ffd6d6; background:rgba(230,57,70,.2); border-color:rgba(255,107,107,.7); }
  #chestList { display:grid; grid-template-columns:1fr 1fr; gap:8px; min-height:0; }
  #chestList .chCol { display:flex; flex-direction:column; min-width:0; border:1px solid var(--line); border-radius:9px; background:rgba(0,0,0,.22); overflow:hidden; }
  #chestList .chCol.chest { border-color:rgba(255,176,0,.4); }
  #chestList .chTop { display:flex; align-items:center; gap:6px; padding:7px 8px; background:rgba(124,255,155,.08); border-bottom:1px solid var(--line); }
  #chestList .chCol.chest .chTop { background:rgba(255,176,0,.10); }

<script>
// ===== オンライン協力(2〜4人)の土台 =====
//   部屋を作った人(ホスト)に、ほかの人が「部屋コード」または招待リンクで入る。通信は WebRTC(PeerJS の無料の仲介サーバーで最初の接続だけ行い、あとは直接つなぐ)。
//   この段階: 同じ世界(同じ種)に入り、おたがいの姿が見える。建築・NPC・敵の共有は次の段階。
//   確認用: ?net=local を付けると、PeerJS の代わりに同じ端末の別タブ同士(BroadcastChannel)でつながる。
(function () {
  var Q = new URLSearchParams(location.search), FAKE = Q.get('net') === 'local', ROOM = (Q.get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
  var PREFIX = 'apoc-sbk-', CODE_CH = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', COLS = ['#ffd24a', '#4ac8ff', '#ff7a7a', '#8aff8a'];
  var ss = { get: function (k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }, del: function (k) { try { sessionStorage.removeItem(k); } catch (e) {} } };
  if (ROOM) ss.set('apoc.net.room', ROOM);
  var GUEST_ROOM = ss.get('apoc.net.room') || '';
  var seedStored = GUEST_ROOM ? ss.get('apoc.net.seed.' + GUEST_ROOM) : null;
  window.__NET_GUEST = !!GUEST_ROOM && seedStored !== null;
  window.__NET_SEED = window.__NET_GUEST ? +seedStored : null;
  window.__NET_STOP = !!GUEST_ROOM && seedStored === null;   // 世界の種を受け取るまで、ゲームは始めない
  var Net = window.Net = { mode: 'solo', code: '', max: 4, slot: 0, roster: [], status: '', listeners: [] };
  function emit() { Net.listeners.forEach(function (f) { try { f(); } catch (e) {} }); }
  Net.onChange = function (f) { Net.listeners.push(f); };
  var peer = null, conns = {}, remote = {}, hostConn = null, sendT = 0, myState = null, hostSeed = null, lastRx = 0;

  // ---- 確認用の偽 PeerJS(同じ端末の別タブ同士) ----
  function FakePeer(id) {
    id = id || ('g' + Math.random().toString(36).slice(2, 9));
    var self = this, h = {}, bc = new BroadcastChannel('apoc-fakepeer'), cs = {}, open = false, taken = false, seq = 0;
    this.id = id;
    this.on = function (e, f) { h[e] = f; return this; };
    function fire(e, a) { if (h[e]) h[e](a); }
    function mk(cid, other) {
      var c = { peer: other, _h: {}, open: false, on: function (e, f) { c._h[e] = f; return c; }, send: function (d) { bc.postMessage({ k: 'd', to: other, from: id, cid: cid, d: JSON.parse(JSON.stringify(d)) }); }, close: function () { bc.postMessage({ k: 'x', to: other, from: id, cid: cid }); c.open = false; } };
      c._fire = function (e, a) { if (c._h[e]) c._h[e](a); };
      cs[cid] = c; return c;
    }
    bc.onmessage = function (ev) {
      var m = ev.data; if (!m) return;
      if (m.k === 'who' && m.id === id && open) bc.postMessage({ k: 'here', id: id });
      else if (m.k === 'here' && m.id === id) taken = true;
      else if (m.to === id) {
        if (m.k === 'c') { var c = mk(m.cid, m.from); c.open = true; bc.postMessage({ k: 'a', to: m.from, from: id, cid: m.cid }); fire('connection', c); setTimeout(function () { c._fire('open'); }, 0); }
        else if (m.k === 'a' && cs[m.cid]) { cs[m.cid].open = true; cs[m.cid]._fire('open'); }
        else if (m.k === 'd' && cs[m.cid]) cs[m.cid]._fire('data', m.d);
        else if (m.k === 'x' && cs[m.cid]) { cs[m.cid].open = false; cs[m.cid]._fire('close'); delete cs[m.cid]; }
      }

  function loadPeerLib(cb) {

  // 画面を離れた・回転した・フォーカスを失ったときは、入力を必ず解除する(押しっぱなし防止)

  function update(dt) {
    if (actOpen || equipOpen) keys = {};   // 操作選択中は移動しない(世界の時間は進む)
    if (titleOpen) { keys = {}; return; }
    if (digestOpen) { keys = {}; return; }   // ダイジェストを読んでいる間は、世界の時間を止める
    if (deathFx.active) { keys = {}; player.moving = false; updateDeathFx(dt); renderStats(); return; }
    stepStats(state.player, dt);   // 生存値の計算
    if (state.player.hp <= 0) beginDeath();   // 死亡地点を記録して演出へ
    renderStats();                 // 生存バーの表示
    renderInventory();             // 持ち物の一覧の表示
    renderCraft();                 // 作る画面の表示
    if (!netIsGuest()) updateCultures();                // 条件を満たした集落の文化を確定
    renderWarn();                  // 安全地域の外にいる間の警告
    renderHudFade();               // 安全地域で止まっているときはHUDを薄く(デザイン資料)
    renderEffects();               // 体力が少ないときの体調不良の演出
    var dx = (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
    var dy = (keys.d ? 1 : 0) - (keys.u ? 1 : 0);
    player.moving = !!(dx || dy);   // 歩きの絵に切り替えるため
    if (dx && dy) { dx *= Math.SQRT1_2; dy *= Math.SQRT1_2; }
    if (dy) { player.fx = 0; player.fy = dy > 0 ? 1 : -1; } else if (dx) { player.fx = dx > 0 ? 1 : -1; player.fy = 0; }   // 向き(斜めは上下を優先)
    var sp = player.speed * speedFactor() * (activeVehicle && VEHICLES[activeVehicle] ? VEHICLES[activeVehicle].speed : 1);   // 体調と乗り物を反映した移動速度
    var nx = player.x + dx * sp * dt;
    if (!blocked(nx, player.y)) player.x = nx;
    var ny = player.y + dy * sp * dt;
    if (!blocked(player.x, ny)) player.y = ny;
    updateSwing(dt);               // 叩く動作・かけら
    pickupResource();              // 足元の資源を自動で拾う
    harvestFarm();                 // 実った畑の収穫
    harvestCrop();                 // 実った作物の収穫
    renderChestBar();              // 倉庫のパネル
    renderBoneBar();               // 骨のダイアログ
    drinkWater(dt);                // 水場で生水を汲む・井戸のそばで飲む
    purifyWater(dt);               // 焚き火のそばで生水を浄水する
    if (!netIsGuest()) { updateNpcs(dt); updateMutants(dt); }   // NPCの生活 / 夜の脅威。ゲストでは動かさない(NPC・敵の共有は次の段階)
    expirePlaced();               // 使用切れの置いたものを壊す
    renderRot();                   // 木の柵の向きボタン
    renderInfo();                  // 情報タブ
    renderNpcBar();                // NPCを選んだときのパネル
    civHudRender();                // 国の文明レベルの進み具合(画面の隅)
    renderMap(Date.now());         // 簡易マップ
    syncLayers();                  // パネルの開閉状態をbodyのクラスにまとめる(重なり回避)
  }

  // 集落の旗そのものは廃止されているため、NPC集落の中心座標を旗の代わりに常時目立たせる。
  // 画面内では光柱・点滅リング・「集落の中心」ラベル、地図では既存の集落マーカーを使う。
  function drawNationLandmarks(camX, camY) {
    var vs = npcVillages(), now = Date.now(), pulse = 0.5 + 0.5 * Math.sin(now / 260);
    ctx.save();
    vs.forEach(function(v, i) {
      var sx = Math.round((v.x + 0.5) * TS - camX), sy = Math.round((v.y + 0.5) * TS - camY);
      if (sx < -48 || sy < -64 || sx > VW + 48 || sy > VH + 30) return;
      var lv = nationRec(i).civ;
      // 背景の暗いプレイ画面でも見失わない、黄白色の光柱
      ctx.globalAlpha = 0.20 + pulse * 0.18;
      ctx.fillStyle = '#ffe66d';
      ctx.fillRect(sx - 2, sy - 34, 4, 38);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = '#fff2a6'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx, sy, 7 + pulse * 4, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#241b08'; ctx.fillRect(sx - 5, sy - 5, 10, 10);
      ctx.fillStyle = '#ffe66d'; ctx.fillRect(sx - 3, sy - 3, 6, 6);
      // 旗の位置を示す小さな旗印
      ctx.strokeStyle = '#fff2a6'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(sx, sy - 3); ctx.lineTo(sx, sy - 28); ctx.stroke();
      ctx.fillStyle = '#ffcf33'; ctx.beginPath(); ctx.moveTo(sx + 1, sy - 27); ctx.lineTo(sx + 14, sy - 23); ctx.lineTo(sx + 1, sy - 18); ctx.closePath(); ctx.fill();
      var label = '集落の中心';
      ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      var w = ctx.measureText(label).width + 12;

      ctx.strokeStyle = '#ffe66d'; ctx.lineWidth = 1; ctx.strokeRect(sx - w/2, sy - 49, w, 13);
      ctx.fillStyle = '#fff2a6'; ctx.fillText(label, sx, sy - 38);
    });
    ctx.restore();
  }

  function draw() {
    var camX = Math.round(player.x + player.w / 2 - VW / 2);
    var camY = Math.round(player.y + player.h / 2 - VH / 2);
    camX = Math.max(0, Math.min(MW * TS - VW, camX));
    camY = Math.max(0, Math.min(MH * TS - VH, camY));
    lastCamX = camX; lastCamY = camY;   // タップした位置からタイルを求めるため

    ctx.fillStyle = '#14120f';
    ctx.fillRect(0, 0, VW, VH);
    glowList.length = 0;

    var x0 = Math.floor(camX / TS), y0 = Math.floor(camY / TS);
    var x1 = Math.min(MW - 1, x0 + Math.ceil(VW / TS) + 1);
    var y1 = Math.min(MH - 1, y0 + Math.ceil(VH / TS) + 1);
    for (var ty = y0; ty <= y1; ty++) {
      for (var tx = x0; tx <= x1; tx++) {
        var t = map[ty][tx];
        var px = tx * TS - camX, py = ty * TS - camY;
        var cc = (t === GRASS) ? BIOME_GRASS[biomeMap[ty][tx]] : COLORS[t];   // 草地は地域の色
        ctx.fillStyle = cc[0];
        ctx.fillRect(px, py, TS, TS);
        // 単調さを避ける仮の点描(位置固定)
        ctx.fillStyle = cc[1];
        for (var i = 0; i < 3; i++) {
          ctx.fillRect(px + Math.floor(hash(tx, ty, 10 + i) * 14), py + Math.floor(hash(tx, ty, 20 + i) * 14), 2, 2);
        }
        if (t === WATER) {   // 汚染水辺: 陸と接する縁に、1pxの薄い明るい線(波打ち際。デザイン資料)
          ctx.fillStyle = 'rgba(170,220,205,0.55)';
          if (ty > 0 && map[ty - 1][tx] !== WATER) ctx.fillRect(px, py, TS, 1);
          if (ty < MH - 1 && map[ty + 1][tx] !== WATER) ctx.fillRect(px, py + TS - 1, TS, 1);
          if (tx > 0 && map[ty][tx - 1] !== WATER) ctx.fillRect(px, py, 1, TS);
          if (tx < MW - 1 && map[ty][tx + 1] !== WATER) ctx.fillRect(px + TS - 1, py, 1, TS);
        }
        if (state.world.holes[tx + ',' + ty]) drawHole(px, py);   // 掘った穴
        var rs = resMap[ty][tx], po = state.world.placed[tx + ',' + ty];   // 資源 / 置いたもの。置いたものの下の資源は描かない
        if (!po && !rs && t === GRASS) glowPlantAt(tx, ty, px, py);
        if (po) { /* 資源は置いたものの下に隠れる */ }
        else if (rs === RES_FRUIT) drawResource(rs, px, py, isDepleted(tx, ty));   // 果実の木は、実を取られても木は残る
        else if (rs && !isDepleted(tx, ty)) drawResource(rs, px, py);        // 取られて生え直し待ちのものは描かない
        drawCultureDecor(tx, ty, px, py);   // 確定文化の街並み装飾
        if (po) {
          if (po.under) drawPlaced('road', px, py, undefined, tx, ty);   // 下の舗道
          var bd = breakDmg[tx + ',' + ty];   // 叩かれているものは、ひびを描く(叩いた瞬間は少し揺れる)
          if (bd && Date.now() - bd.at > BREAK_FORGET) { delete breakDmg[tx + ',' + ty]; bd = null; }
          if (bd && Date.now() - bd.at < 120) { ctx.save(); ctx.translate(Math.floor(Date.now() / 30) % 2 ? 1 : -1, 0); drawPlaced(po.type, px, py, po.dir, tx, ty); ctx.restore(); }
          else drawPlaced(po.type, px, py, po.dir, tx, ty);
          if (bd) drawBreakFx(px, py, bd, BREAK_HITS[po.type] || 3);
        } else if (t === ROCK || t === WATER) {   // 叩かれている岩・水は、ひびを描く
          var td = breakDmg['t' + tx + ',' + ty];
          if (td) { if (Date.now() - td.at > BREAK_FORGET) delete breakDmg['t' + tx + ',' + ty]; else drawBreakFx(px, py, td, t === ROCK ? TERRAIN_NEED.rock : TERRAIN_NEED.water); }
        }
      }
    }

    drawNationLandmarks(camX, camY); // 集落の中心を見失わないための常設目印
    drawAncestors(camX, camY);   // 死亡地点に残る祖先の骨
    drawBuildSites(camX, camY);   // 建設中の家の予定地
    drawHitProgress(camX, camY);
    drawTerrainProgress(camX, camY);
    drawGoalMarker(camX, camY);   // 次の目標の目印(置き場所の枠・矢印)
    drawPlacePreview(camX, camY);   // 置けるものを持っているとき、置く位置を示す

    // プレイヤー(仮の四角)
    var sx = Math.round(player.x - camX), sy = Math.round(player.y - camY);
    drawNpcs(camX, camY, false);   // プレイヤーより奥(上)にいるNPC
    drawRemotePlayers(camX, camY);   // オンラインの仲間
    drawPlayerSprite(sx, sy);   // プレイヤーのドット絵
    drawPick(sx, sy);
    drawNpcs(camX, camY, true);    // プレイヤーより手前(下)にいるNPC
    drawMutants(camX, camY);
    drawChips(camX, camY);

    drawDayNight(sx + player.w / 2, sy + player.h / 2, camX, camY);  // 昼夜
    drawGlows();   // 夜に光る点(鉄の壁のネオン・光る草・井戸)
    drawWeather();   // 天候
    var hurtT = Date.now() - hurtAt;   // かまれたとき、画面が一瞬赤くなる
    if (hurtT < 250) { ctx.fillStyle = 'rgba(200,30,30,' + (0.35 * (1 - hurtT / 250)).toFixed(2) + ')'; ctx.fillRect(0, 0, VW, VH); }
    drawDeathFx();   // collapse -> monochrome -> particles -> inheritance
  }

  // ===== プレイヤーのドット絵(第1世代のサバイバー。ちびキャラ) =====
  // 10x12px(もとの当たり判定の大きさ10pxに合わせた)。文字の絵で持ち、1文字=1ドット(. は透明)。
  // 上半身(10行)と脚(2行)を分けて描き、脚を入れ替えて歩きを表す。
  //   正面・背面・横(左は横を左右反転)の4方向。待機は2コマ(呼吸)、歩行は4コマ(歩幅+上下の揺れ)。走行・斜め向きは未対応。
  //   見た目: 頭が大きく、ほっぺの赤みと縦長の大きな目。ゴーグルをフードの上に上げ、赤いぼろ布を首に巻く。
  //   つぎはぎのオリーブ色の外套に革のベルトと背負い荷、すり切れた裾。(デザイン資料のアースカラー)

  var PS_FRONT = [
    "..KKKKKK..",
    ".KhhHhhhK.",
    "KhGlhhlGhK",
    "KhsssssshK",
    "KhsEssEshK",
    "KhrEssErhK",
    ".KcCccCcK.",
    ".KooooooK.",
    "KsoobboosK",
    ".KoOpoOoK."
  ];
  var PS_BACK = [
    "..KKKKKK..",
    ".KhhHhhhK.",
    "KhHHhhhhhK",
    "KhhhhhhhhK",
    "KhhhhhhhhK",
    "KhhhhhhhhK",
    ".KcCccCcK.",
    ".KoooomoK.",
    "KsobBBbosK",
    ".KobBBboK."
  ];
  var PS_SIDE = [
    "..KKKKK...",
    ".KhhHhhK..",
    "KhhhhhGlK.",
    "KhhhhssssK",
    "KhhhhsEssK",
    "KhhhhsErsK",
    ".KhhhcCccK",
    ".KBboooooK",
    "KBbooboosK",
    ".KBboopoK."
  ];
  var PS_LEG = [
    "KtK",
    "KwK"
  ], PS_SLEG = [
    "KtK.",
    "KwwK"
  ];
  // 文字の絵を描く(同じ色が続くところはまとめて1回で描く)
  function psDraw(rows, x, y, pal) {
    var P = pal || PS_PAL;
    for (var j = 0; j < rows.length; j++) {
      var r = rows[j], i = 0;
      while (i < r.length) {
        var ch = r.charAt(i);
        if (ch === '.') { i++; continue; }
        var k = i + 1;
        while (k < r.length && r.charAt(k) === ch) k++;

        ctx.fillRect(x + i, y + j, k - i, 1);

  }
  function drawRemotePlayers(camX, camY) {   // オンラインで同じ世界にいる仲間(自分と同じ姿。腕章と名前の色で見分ける)
    var rs = window.Net && Net.mode !== 'solo' ? Net.remotes() : [];
    rs.sort(function (a, b) { return a.y - b.y; });
    rs.forEach(function (r) {
      var sx = Math.round(r.x - camX), sy = Math.round(r.y - camY);
      if (sx < -20 || sy < -24 || sx > VW + 20 || sy > VH + 20) return;
      var sv = { x: player.x, y: player.y, fx: player.fx, fy: player.fy, moving: player.moving };
      player.x = r.x; player.y = r.y; player.fx = r.fx; player.fy = r.fy; player.moving = !!r.mv; armOv = r.col;
      drawPlayerSprite(sx, sy);
      player.x = sv.x; player.y = sv.y; player.fx = sv.fx; player.fy = sv.fy; player.moving = sv.moving; armOv = null;
      var cx = sx + player.w / 2, top = sy + player.h - 11 - 6;   // 頭の上に、仲間の色の目印と番号
      ctx.fillStyle = '#1a1410'; ctx.fillRect(Math.round(cx) - 4, top - 1, 9, 6);

      ctx.lineWidth = 2; ctx.strokeStyle = '#1a1410'; ctx.strokeText(r.nm, cx, top - 2); ctx.fillStyle = '#fff'; ctx.fillText(r.nm, cx, top - 2);
    });
  }
  function drawPlayerSprite(sx, sy) {   // sx, sy: 当たり判定の左上の画面上の位置
    var t = Date.now(), leg = 0, bob;
    if (player.moving) { var f = Math.floor(t / 140) % 4; leg = [1, 0, 2, 0][f]; bob = (f % 2 === 0) ? 1 : 0; }
    else bob = Math.floor(t / 600) % 2;   // 待機: ゆっくり呼吸
    var left = sx, top = sy + player.h - 11;   // 絵の足元が当たり判定の足元に合う位置
    var cxm = sx + player.w / 2;
    ctx.fillStyle = 'rgba(0,0,0,0.30)';   // 足元の影
    ctx.fillRect(Math.round(cxm - 4), sy + player.h, 8, 1); ctx.fillRect(Math.round(cxm - 3), sy + player.h + 1, 6, 1);
    if (player.fy !== 0) {   // 正面(下向き) / 背面(上向き)

      psDraw(PS_LEG, left + 5, top + 10 + (leg === 2 ? -1 : 0));
      psDraw(player.fy > 0 ? PS_FRONT : PS_BACK, left, top + bob);
    } else {                 // 横(右向き。左向きは左右反転)
      var flip = player.fx < 0, d = leg === 1 ? [-1, 1] : (leg === 2 ? [1, -1] : [0, 0]);
      ctx.save();

      psDraw(PS_SLEG, left + 3 + d[1], top + 10);
      psDraw(PS_SLEG, left + 3 + d[0], top + 10);
      psDraw(PS_SIDE, left, top + bob);
      ctx.restore();
    }
    if (activeVehicle && VEHICLES[activeVehicle]) {
      // 乗り物はキャラクターの足元に小さなピクセル風マークで表示。操作中もキャラの判定サイズは変えない。
      ctx.font = '12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillText(VEHICLES[activeVehicle].icon, sx + player.w / 2, sy - 1);
    }
    ctx.fillStyle = armbandColor();   // 所属の腕章(国の色 / 無所属は白 / 亡命者は黒)
    if (player.fy !== 0) { ctx.fillRect(sx, top + bob + 5, 2, 2); ctx.fillRect(sx + 8, top + bob + 5, 2, 2); }
    else ctx.fillRect(sx + 4, top + bob + 5, 2, 3);
  }

  // ===== 昼夜(デザイン資料の「環境ライティング」に合わせた) =====
  // 昼夜は「端末の現在時刻」から決まる(保存しない)。夜に開けば夜、朝に開けば朝になっている。
  //   朝 05:00-08:00 淡い桃橙(#FFD1A4・濃さ15%) / 昼 08:00-16:00 なし / 夕 16:00-19:00 赤橙(#FF6B35・濃さ30%)
  //   夜 19:00-05:00 濃いネイビー(#0A1128・濃さ65%)。時間帯のあいだはなめらかに推移する。
  // 夜は、操作キャラクターを中心に半径64px(タイル4枚分)の円形の明かりが灯る。ふちはやわらかい。
  var NIGHT_ALPHA = 0.65, LIGHT_R = 64;
  var LIGHT_KEYS = [   // [時刻, [r,g,b], 濃さ] このあいだを直線でつなぐ
    [0, [10, 17, 40], NIGHT_ALPHA], [5, [10, 17, 40], NIGHT_ALPHA], [6.5, [255, 209, 164], 0.15], [8, [255, 209, 164], 0],
    [16, [255, 107, 53], 0], [17.5, [255, 107, 53], 0.30], [19, [10, 17, 40], NIGHT_ALPHA], [24, [10, 17, 40], NIGHT_ALPHA]
  ];
  // 夜の定義を1か所にまとめた(仕様書: 夜 19:00-05:00 / 夕 16:00-19:00)。
  // 描画・変異獣・NPCの就寝・不在中のダイジェストは、すべてここを使う。
  var NIGHT_FROM = 19, NIGHT_TO = 5, EVENING_FROM = 16;
  function isNightHour(h) { return h >= NIGHT_FROM || h < NIGHT_TO; }
  // 昼と夜は現実の時間で入れ替わる(昼5分→夜2分で、7分でひとめぐり)。
  //   ゲーム内の時刻(0〜24時)は、現実の時刻から決まる(保存しない。みんな同じ時刻になる)。
  //   昼の5分で 5時→19時(14時間)、夜の2分で 19時→翌5時(10時間)が進む。朝・夕の色の移り変わりも、この時刻で動く。
  var DAY_MS = 5 * 60 * 1000, NIGHT_MS = 2 * 60 * 1000, CYC_MS = DAY_MS + NIGHT_MS;
  function gameHourAt(ms) {
    var t = ((ms % CYC_MS) + CYC_MS) % CYC_MS;   // 0 = 夜明け(5時)
    var h = t < DAY_MS ? 5 + t / DAY_MS * 14 : 19 + (t - DAY_MS) / NIGHT_MS * 10;
    return h >= 24 ? h - 24 : h;
  }
  function daylightAt(ms) {
    var h = gameHourAt(ms);
    var k = 0;
    while (k < LIGHT_KEYS.length - 2 && h >= LIGHT_KEYS[k + 1][0]) k++;
    var a = LIGHT_KEYS[k], b = LIGHT_KEYS[k + 1], t = (h - a[0]) / (b[0] - a[0]);
    function mix(x, y) { return x + (y - x) * t; }
    var name = (h >= 5 && h < 8) ? '朝' : ((h >= 8 && h < 16) ? '昼' : ((h >= 16 && h < 19) ? '夕' : '夜'));
    return { h: h, name: name, r: Math.round(mix(a[1][0], b[1][0])), g: Math.round(mix(a[1][1], b[1][1])),
             b: Math.round(mix(a[1][2], b[1][2])), a: mix(a[2], b[2]) };
  }
  function drawDayNight(cx, cy, camX, camY) {   // cx, cy: 操作キャラクターの画面上の位置(夜の明かりの中心)
    var L = daylightAt(Date.now());
    if (L.a <= 0) return;   // 昼: オーバーレイなし
    var col = L.r + ',' + L.g + ',' + L.b;
    var s = clamp01((L.a - 0.30) / (NIGHT_ALPHA - 0.30));   // 夜の深さ(0〜1)。深いほど明かりがはっきり効く
    if (s <= 0) {   // 朝・夕: 画面全体にうっすら色をのせるだけ
      ctx.fillStyle = 'rgba(' + col + ',' + L.a.toFixed(3) + ')';
      ctx.fillRect(0, 0, VW, VH);
      return;
    }
    var c0 = L.a * (1 - s);   // 明かりの中心の濃さ(夜が深いほど透明になる)
    var fires = campfiresOnScreen(camX, camY);   // 画面内の焚き火(夜、周りを照らす)
    var tg = ctx;
    if (fires.length) {   // 焚き火があるときは、夜の暗がりを別の紙に描いて、焚き火の周りをくり抜いてから重ねる
      if (!lightCv) { lightCv = document.createElement('canvas'); lightCv.width = VW; lightCv.height = VH; lightCx = lightCv.getContext('2d'); }
      lightCx.globalCompositeOperation = 'source-over';
      lightCx.clearRect(0, 0, VW, VH);
      tg = lightCx;
    }
    var g = tg.createRadialGradient(cx, cy, 6, cx, cy, LIGHT_R);
    g.addColorStop(0, 'rgba(' + col + ',' + c0.toFixed(3) + ')');
    g.addColorStop(0.5, 'rgba(' + col + ',' + (c0 + (L.a - c0) * 0.35).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(' + col + ',' + L.a.toFixed(3) + ')');
    tg.fillStyle = g;
    tg.fillRect(0, 0, VW, VH);
    if (fires.length) {
      var now = Date.now();
      lightCx.globalCompositeOperation = 'destination-out';
      fires.forEach(function (f) {
        f.fk = f.st ? 0.5 : fireFlicker(f.seed, now);   // 0〜1: 明るさのゆらぎ
        var fl = FIRE_R * f.r * (0.88 + 0.24 * f.fk);   // 明かりの半径も揺れる(約28〜36px)
        var fg = lightCx.createRadialGradient(f.x, f.y, 2, f.x, f.y, fl);
        fg.addColorStop(0, 'rgba(0,0,0,1)'); fg.addColorStop(0.4, 'rgba(0,0,0,0.82)');
        fg.addColorStop(0.75, 'rgba(0,0,0,0.35)'); fg.addColorStop(1, 'rgba(0,0,0,0)');
        lightCx.fillStyle = fg;
        lightCx.fillRect(f.x - fl, f.y - fl, fl * 2, fl * 2);
      });
      lightCx.globalCompositeOperation = 'source-over';
      ctx.drawImage(lightCv, 0, 0);
      ctx.globalCompositeOperation = 'lighter';   // 焚き火らしい暖かい橙色の光を足す(明るさに合わせて揺れる)
      fires.forEach(function (f) {
        var wr = FIRE_R * f.r * (0.95 + 0.2 * f.fk);
        var wg = ctx.createRadialGradient(f.x, f.y, 1, f.x, f.y, wr);
        wg.addColorStop(0, 'rgba(255,170,70,' + ((0.20 + 0.20 * f.fk) * s).toFixed(3) + ')');
        wg.addColorStop(0.5, 'rgba(255,120,35,' + ((0.10 + 0.10 * f.fk) * s).toFixed(3) + ')');
        wg.addColorStop(1, 'rgba(255,100,20,0)');
        ctx.fillStyle = wg;
        ctx.fillRect(f.x - wr, f.y - wr, wr * 2, wr * 2);
      });
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  // ===== 天候 =====
  // 天候は「現実の時刻」から決まる(保存しない)。閉じている間も世界の天候は進み、
  // 開き直したときは、そのときの天候になっている。将来オンラインでも、全員が同じ天候になる。
  var WEATHER_CELL_MS = 1 * 60 * 60 * 1000;   // 天候が移り変わる長さの目安(約1〜2時間。テンポ調整で2〜4時間から短くした)
  var WEATHER_SEED = 7;
  var WEATHER_NAMES = { clear: '晴れ', cloudy: 'くもり', rain: '雨', storm: '嵐' };
  var RAIN_MAX = 90, STORM_EXTRA = 70;        // 雨粒の数(雨のときの最大 / 嵐でさらに増える数)

  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function weatherAt(ms) {
    var n = vnoise(ms / WEATHER_CELL_MS, 0, WEATHER_SEED);   // 0〜1でなめらかに変わる値
    var type = n < 0.45 ? 'clear' : (n < 0.62 ? 'cloudy' : (n < 0.85 ? 'rain' : 'storm'));
    return {
      n: n, type: type,
      cloud: clamp01((n - 0.42) / 0.2),   // 雲の濃さ
      rain: clamp01((n - 0.62) / 0.2),    // 雨の強さ
      storm: clamp01((n - 0.85) / 0.1)    // 嵐の強さ
    };
  }

  // 画面に天候を描く(仮の表現。本番のドット絵に差し替えやすいよう、ここに集約)
  function drawWeather() {
    var t = Date.now();
    var w = weatherAt(t);
    if (w.cloud <= 0) return;   // 晴れ: 何も描かない

    // 空が暗くなる
    var dark = w.cloud * 0.14 + w.rain * 0.12 + w.storm * 0.14;
    ctx.fillStyle = 'rgba(8,14,24,' + dark.toFixed(3) + ')';
    ctx.fillRect(0, 0, VW, VH);

    // 雨粒(位置は時刻から決まるので、状態を持たない)
    var count = Math.floor(w.rain * RAIN_MAX + w.storm * STORM_EXTRA);
    if (count > 0) {
      var vy = 150 + w.storm * 110, vx = w.storm * 70;   // 落ちる速さと、風で流れる速さ(px/秒)
      var slant = w.storm > 0.3 ? 1 : 0;
      ctx.fillStyle = 'rgba(175,205,230,0.55)';
      for (var i = 0; i < count; i++) {
        var sp = 0.8 + hash(i, 3, 41) * 0.4;
        var rx = ((hash(i, 1, 41) * VW + t / 1000 * vx * sp) % VW + VW) % VW;
        var ry = ((hash(i, 2, 41) * VH + t / 1000 * vy * sp) % VH + VH) % VH;
        ctx.fillRect(Math.floor(rx), Math.floor(ry), 1, 2);
        ctx.fillRect(Math.floor(rx) + slant, Math.floor(ry) + 2, 1, 2);
      }
    }

    // 嵐の稲光(まれに、ごく短く光る)
    if (w.storm > 0.5) {
      var bucket = Math.floor(t / 3000), phase = t % 3000;
      if (hash(bucket, 0, 99) < 0.3 && phase < 110) {
        ctx.fillStyle = 'rgba(255,255,255,0.22)';
        ctx.fillRect(0, 0, VW, VH);
      }
    }
  }

  // 画面いっぱいにフィールドを出す。ドットの拡大率(整数)を画面の短い辺から決め、
  // その拡大率で画面全体を覆うだけの広さ(VW x VH)を描く(はみ出す端は最大でドット1つ分)。
  function fit() {
    var w = window.innerWidth, h = window.innerHeight;
    var sc = Math.max(2, Math.floor(Math.min(w, h) / 180));
    VW = Math.ceil(w / sc); VH = Math.ceil(h / sc);
    canvas.width = VW; canvas.height = VH;
    canvas.style.width = (VW * sc) + 'px';
    canvas.style.height = (VH * sc) + 'px';
    lightCv = null;   // 夜の明かり用の描画先は、大きさが変わったので作り直す
  }
  window.addEventListener('resize', fit);
  fit();

  // ===== 世界データの整理 =====
  // 世界の状態(world)とプレイヤーの状態(player)を、1つの state にまとめる。
  // 保存・読み込みは store / loadState / saveState だけが担当する
  // (将来オンライン化するときは、この部分をサーバー通信に差し替える)。
  var SAVE_KEY = window.__NET_GUEST ? 'apoc.save.net' : 'apoc.save.v3';              // 新しい保存キー(1つに統一)
  var LEGACY_WORLD_KEY = 'apoc.world.v1';     // 旧: 世界の時間(読み込みのみ。引き継ぎ用)
  var LEGACY_PLAYER_KEY = 'apoc.player.v1';   // 旧: 生存値(読み込みのみ。引き継ぎ用)

  // 世界の時間と生存値の設定(テンポ調整で、空腹・渇きの減りを速くした: 空腹 24→2時間、渇き 12→1時間)
  var FOOD_HOURS = 2, WATER_HOURS = 1;   // 満タンから0になるまでの時間
  var HP_LOSS_SEC = 600;                   // 空腹か渇きが0のとき、体力が満タンから0になるまでの秒数
  var HP_MIN = 1;                          // 閉じている間(オフライン)は、体力がここで止まり死亡しない
  var HP_LOW = 30;                         // 体力がこれ以下になると体調不良が始まり、1に近づくほど強くなる
  var HP_REGEN_SEC = 1800;                 // 安全地域で静止して休むと、30分でHPが満タンまで回復
  var SLOW_MAX = 0.5;                      // 体調不良が最大のときの移動速度の割合(0.5 = 半分)

  var state = {
    world: { createdAt: Date.now(), lastSeen: Date.now(), depleted: {}, placed: {}, terrain: {}, holes: {}, ancestors: [], legends: [], values: {}, npcs: [], seed: WORLD_SEED, policy: 'balanced', cons: {}, culture: {}, pda: { act: 0 } },   // 世界の時間(現実の時間と同じ速さで進む)
    player: { hp: 100, food: 100, water: 100, inventory: {}, bottleWater: 0, bottleRaw: 0, equip: '', skill: 0, partnerId: -1, kidAt: 0, gen: 1, curses: [], alle: { k: 'none', v: -1, from: -1 }, joined: {}, contrib: {} } // 何も持たない状態で開始(持ち物は { 品物: 個数 } 。)
  };
  var awayMs = 0;   // 前回開いてからの経過(実行時のみの値。保存しない)
  var awayProtected = false;   // 前回の不在中、安全地域にいたため生存値が守られたか(実行時のみ)

  // --- 保存先(localStorage)に触れるのはここだけ ---
  var store = {
    read: function (key) {
      try {
        var raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }   // 保存が使えない環境では新しい状態から始まる
    },
    write: function (key, obj) {
      try { localStorage.setItem(key, JSON.stringify(obj)); } catch (e) { /* 保存できなくても動作は続ける */ }
    }
  };

  function applyPlayer(src) {
    if (!src || typeof src !== 'object') return;
    if (src.demo === true) {   // デモ版を廃止。ONのまま保存されていたら、ONにする前の持ち物に戻す
      var bk = (src.demoBak && typeof src.demoBak === 'object') ? src.demoBak : { inv: {}, bw: 0, br: 0, equip: '' };
      src = Object.assign({}, src, { inventory: bk.inv || {}, bottleWater: bk.bw || 0, bottleRaw: bk.br || 0, equip: bk.equip || '' });
    }
    ['hp', 'food', 'water'].forEach(function (k) {
      if (typeof src[k] === 'number' && src[k] >= 0 && src[k] <= 100) state.player[k] = src[k];
    });
    if (state.player.hp < HP_MIN) state.player.hp = HP_MIN;   // 旧版で体力0のまま保存されていた場合も瀕死に戻す
    applyInventory(src.inventory);
    if (typeof src.skill === 'number' && isFinite(src.skill) && src.skill >= 0) state.player.skill = Math.floor(src.skill);
    var al0 = src.alle;   // 所属(無所属 none / 加盟 member / 亡命 exile)。世代交代しても引き継ぐ
    state.player.alle = { k: 'none', v: -1, from: -1 };
    if (al0 && (al0.k === 'member' || al0.k === 'exile') && typeof al0.v === 'number' && isFinite(al0.v) && al0.v >= 0 && al0.v < 12) {
      state.player.alle = { k: al0.k, v: Math.floor(al0.v), from: (al0.k === 'exile' && typeof al0.from === 'number' && isFinite(al0.from) && al0.from >= 0 && al0.from < 12) ? Math.floor(al0.from) : -1 };
    }
    state.player.contrib = {};   // 国ごとに納めた物資の数(貢献)
    if (src.contrib && typeof src.contrib === 'object') Object.keys(src.contrib).forEach(function (k) { var n = src.contrib[k]; if (/^\d{1,2}$/.test(k) && typeof n === 'number' && isFinite(n) && n > 0) state.player.contrib[k] = Math.floor(n); });
    state.player.joined = {};   // 加盟して経験値を得た国(国ごとに一度)
    if (src.joined && typeof src.joined === 'object') Object.keys(src.joined).forEach(function (k) { if (/^\d{1,2}$/.test(k) && src.joined[k]) state.player.joined[k] = 1; });
    if (typeof src.partnerId === 'number' && isFinite(src.partnerId)) state.player.partnerId = Math.floor(src.partnerId);   // パートナー・子作り・世代
    if (typeof src.kidAt === 'number' && isFinite(src.kidAt) && src.kidAt >= 0) state.player.kidAt = src.kidAt;
    if (typeof src.gen === 'number' && isFinite(src.gen) && src.gen >= 1) state.player.gen = Math.floor(src.gen);   // 職人スキルの経験値   // 持ち物の復元(保存がなければ空のまま)
    state.player.equip = (typeof src.equip === 'string' && TOOLS[src.equip] && (state.player.inventory[src.equip] || 0) > 0) ? src.equip : '';   // 装備
    activeVehicle = (typeof src.vehicle === 'string' && VEHICLES[src.vehicle] && (state.player.inventory[src.vehicle] || 0) > 0) ? src.vehicle : null;
    state.player.curses = [];   // 継承の代償(呪い)
    if (Array.isArray(src.curses)) src.curses.forEach(function (c) { if (CURSES[c] && state.player.curses.indexOf(c) < 0) state.player.curses.push(c); });
    var bw = src.bottleWater, br = src.bottleRaw;        // 水筒の中身(水筒を持っていないときは0)。浄水(bottleWater)と生水(bottleRaw)
    state.player.bottleWater = (state.player.inventory.bottle > 0 && typeof bw === 'number' && isFinite(bw)) ? Math.max(0, Math.min(BOTTLE_MAX, bw)) : 0;
    state.player.bottleRaw = (state.player.inventory.bottle > 0 && typeof br === 'number' && isFinite(br)) ? Math.max(0, Math.min(BOTTLE_MAX - state.player.bottleWater, br)) : 0;
  }
  function applyWorld(src, now) {
    if (!src || typeof src !== 'object') return;
    if (typeof src.createdAt === 'number' && typeof src.lastSeen === 'number') {
      state.world.createdAt = Math.min(src.createdAt, now);
      awayMs = Math.max(0, now - src.lastSeen);   // 前回開いてからの経過
    }
    state.world.terrain = {};   // 整地(壊した岩・埋め立てた水)。元の地形に上書きして復元する。古い保存データにはないので、空のまま
    if (src.terrain && typeof src.terrain === 'object') Object.keys(src.terrain).forEach(function (k) {
      var m = /^(\d+),(\d+)$/.exec(k), tv = src.terrain[k]; if (!m || (tv !== GRASS && tv !== WATER)) return;
      var x = +m[1], y = +m[2]; if (x < 1 || y < 1 || x >= MW - 1 || y >= MH - 1 || map[y][x] === SHELTER) return;
      if (tv === GRASS && map[y][x] !== ROCK && map[y][x] !== WATER) return;   // 埋め立て・岩を壊した跡
      map[y][x] = tv; if (tv === WATER) resMap[y][x] = RES_NONE; state.world.terrain[k] = tv;   // 掘った川も復元する
    });
    state.world.holes = {};   // スコップで掘った穴(草地の上に重ねる。通れる)
    if (src.holes && typeof src.holes === 'object') Object.keys(src.holes).forEach(function (k) {
      var m = /^(\d+),(\d+)$/.exec(k); if (!m) return;
      var x = +m[1], y = +m[2]; if (x < 1 || y < 1 || x >= MW - 1 || y >= MH - 1 || map[y][x] !== GRASS) return;
      state.world.holes[k] = 1; resMap[y][x] = RES_NONE;
    });
    state.world.policy = 'balanced';   // 拠点方針
    applyPlaced(src.placed, now);       // 置いたものの復元(使用切れのものは壊れている)
    state.world.ancestors = [];         // 祖先の骨(死亡地点)を世界に復元
    state.world.legends = [];          // 祖先について後世に残る伝承を復元
    if (Array.isArray(src.ancestors)) src.ancestors.slice(0, 200).forEach(function (a) {
      if (!a || typeof a.x !== 'number' || typeof a.y !== 'number' || !isFinite(a.x + a.y)) return;
      var g = (typeof a.gen === 'number' && isFinite(a.gen) && a.gen >= 1) ? Math.floor(a.gen) : 1;
      var at = (typeof a.at === 'number' && isFinite(a.at) && a.at >= 0) ? Math.min(a.at, now) : now;
      var an = { x: Math.floor(a.x), y: Math.floor(a.y), gen: g, at: at, kind: 'ancestor', items: {}, looted: !!a.looted, sk: (typeof a.sk === 'number' && isFinite(a.sk) && a.sk > 0) ? Math.floor(a.sk) : 0, inherited: !!a.inherited, buried: !!a.buried };   // 骨に残る遺品
      if (a.items && typeof a.items === 'object') Object.keys(a.items).forEach(function (ik) {
        var v = a.items[ik];
        if (ITEMS[ik] && ik !== 'bottle' && typeof v === 'number' && isFinite(v) && v >= 1) an.items[ik] = Math.min(ITEM_MAX, Math.floor(v));
      });
      state.world.ancestors.push(an);
    });
    state.world.values = {};
    if (src.values && typeof src.values === 'object') Object.keys(src.values).forEach(function (k) {
      if (!/^v\d+$/.test(k) || !src.values[k] || typeof src.values[k] !== 'object') return;
      var v = src.values[k], o = { defense: 0, water: 0, food: 0, frontier: 0 };
      ['defense','water','food','frontier'].forEach(function (f) { if (typeof v[f] === 'number' && isFinite(v[f])) o[f] = Math.max(0, Math.min(20, v[f])); });
      state.world.values[k] = o;
    });
    if (Array.isArray(src.legends)) src.legends.slice(0, 200).forEach(function (l) {
      if (!l || typeof l.gen !== 'number' || !isFinite(l.gen)) return;
      state.world.legends.push({ gen: Math.max(1, Math.floor(l.gen)), text: typeof l.text === 'string' ? l.text.slice(0, 120) : '記録なし', accuracy: typeof l.accuracy === 'number' ? Math.max(0, Math.min(1, l.accuracy)) : 1, at: typeof l.at === 'number' ? Math.max(0, Math.min(l.at, now)) : now });
    });
    applyDepleted(src.depleted, now);   // 取られた資源の復元(2時間たったものは生え直している)
    state.world.extraSites = [];   // 独立した夫婦の新しい家
    if (Array.isArray(src.extraSites)) src.extraSites.slice(0, EXTRA_MAX).forEach(function (e) {
      if (e && typeof e.x === 'number' && typeof e.y === 'number' && typeof e.v === 'number' && e.x >= 3 && e.y >= 3 && e.x < MW - 3 && e.y < MH - 4 && e.v >= 0 && e.v < VILLAGE_SIZES.length) state.world.extraSites.push({ x: Math.floor(e.x), y: Math.floor(e.y), v: Math.floor(e.v) });
    });
    state.world.pv = null;   // プレイヤーは国を興せない(古い保存にあった「あなたの集落」は読み込まない)
    state.world.cons = {};   // 集落ごとの資源消費の累積(v0,v1…=NPCの集落 / pv=あなたの集落)
    if (src.cons && typeof src.cons === 'object') Object.keys(src.cons).forEach(function (k) {
      var c = src.cons[k];
      if (!/^v\d+$/.test(k) || !c || typeof c !== 'object') return;
      var o = { m: 0, w: 0, e: 0 };
      ['m', 'w', 'e'].forEach(function (f) { if (typeof c[f] === 'number' && isFinite(c[f]) && c[f] > 0) o[f] = Math.floor(c[f]); });
      state.world.cons[k] = o;
    });
    state.world.culture = {};   // 集落ごとの文化(確定名を保存)
    if (src.culture && typeof src.culture === 'object') Object.keys(src.culture).forEach(function (k) {
      var v = src.culture[k];

  function loadState() {

    if (saved && typeof saved === 'object') {
      applyPlayer(saved.player);
      applyPosition(saved.player);
      wasSafe = !!(saved.player && saved.player.safe === true);
      applyWorld(saved.world, now);
    } else {
      // 新しい保存がなければ、旧バージョンの保存データを引き継ぐ
      applyPlayer(store.read(LEGACY_PLAYER_KEY));
      applyWorld(store.read(LEGACY_WORLD_KEY), now);

    initNpcs(saved && typeof saved === 'object' && saved.world ? saved.world.npcs : null, awayMs);   // NPCを世界に置く(保存があれば復元)

    state.world.npcs.forEach(function (n) { if (n.id === n.fam) npcProf(n); });

  // --- 生存要素(体力・空腹・渇き): 計算 ---
  // 空腹・渇きは現実の時間でゆっくり減る。どちらかが0なら体力が減る。
  // 安全地域で静止して休むと、体力が徐々に回復する。
  function stepStats(p, dt) {
    p.food = Math.max(0, p.food - 100 / (FOOD_HOURS * 3600) * dt * (hasCurse('hunger') ? 1.3 : 1));
    p.water = Math.max(0, p.water - 100 / (WATER_HOURS * 3600) * dt * (hasCurse('thirst') ? 1.3 : 1));
    if (p.food <= 0 || p.water <= 0) {
      p.hp = Math.max(0, p.hp - 100 / HP_LOSS_SEC * dt);   // 遊んでいる間は0まで減る(死亡は update で処理)
    } else if (p.hp < 100 && (inSafeZone() || facRegenMul() > 1) && !(keys.l || keys.r || keys.u || keys.d)) {
      // 安全地域で動かず休むと、ゆっくり体力が戻る。
      // 食料・水が尽きている間は回復せず、従来どおり生存値を優先する。
      p.hp = Math.min(100, p.hp + 100 / HP_REGEN_SEC * dt * facRegenMul() * (hasCurse('frail') ? 0.5 : 1));
    }
  }

  // --- 生存要素: まとまった経過時間 ---
  // 閉じていた時間などをまとめて進める。stepStats と同じ減り方で、
  // 「空腹か渇きが0になった時点から」体力が減る(閉じている間に死亡はしない。体力は HP_MIN で止まる)。
  function elapseStats(p, sec) {
    if (!(sec > 0)) return;
    var foodRate = 100 / (FOOD_HOURS * 3600), waterRate = 100 / (WATER_HOURS * 3600);
    var untilEmpty = Math.min(p.food / foodRate, p.water / waterRate);   // どちらかが0になるまでの秒数
    var starving = Math.max(0, sec - untilEmpty);                       // 0になってから経過した秒数
    p.food = Math.max(0, p.food - foodRate * sec);
    p.water = Math.max(0, p.water - waterRate * sec);
    p.hp = Math.max(HP_MIN, p.hp - 100 / HP_LOSS_SEC * starving);
  }

  function renderWorldHud() {

    var hh = Math.floor(L.h), mm = Math.floor((L.h - hh) * 60);
    var clock = (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
    var day = Math.floor(worldAgeMs() / 86400000) + 1;
    var gen = Math.max(1, Math.floor(state.player.gen || 1));
    if (clock !== hudTimeShown) { hudTimeShown = clock; hudClock.textContent = clock; }
    if (day !== hudDayShown) { hudDayShown = day; hudDay.textContent = '第' + day + '日'; }
    var hl = L.h, toMs = hl >= 5 && hl < 19 ? (19 - hl) / 14 * DAY_MS : ((hl >= 19 ? 29 - hl : 5 - hl) / 10 * NIGHT_MS), sec = Math.max(0, Math.ceil(toMs / 1000));
    var nx = (hl >= 5 && hl < 19 ? '夜まで ' : '夜明けまで ') + Math.floor(sec / 60) + ':' + (sec % 60 < 10 ? '0' : '') + (sec % 60);
    if (nx !== hudNextShown) { hudNextShown = nx; hudNext.textContent = nx; }

      var src = netSrc(n), sn = netSnap[n] || (netSnap[n] = {});
      Object.keys(src).forEach(function (k) {
        var v = JSON.stringify(src[k]);
        if (sn[k] !== v) { ops = ops || {}; (ops[n] = ops[n] || {})[k] = src[k]; sn[k] = v; }
      });
      Object.keys(sn).forEach(function (k) {
        if (!(k in src)) { ops = ops || {}; (ops[n] = ops[n] || {})[k] = null; delete sn[k]; }
      });
    });
    return ops;
  }
  function netApplyTile(n, k, v) {   // 地形・穴は、地図そのものも書き換える
    var m = /^(\d+),(\d+)$/.exec(k); if (!m) return;
    var x = +m[1], y = +m[2]; if (x < 0 || y < 0 || x >= MW || y >= MH) return;
    if (n === 'terrain' && (v === GRASS || v === WATER)) { map[y][x] = v; if (v === WATER) resMap[y][x] = RES_NONE; }
    else if (n === 'holes' && v) resMap[y][x] = RES_NONE;
  }
  function netApply(ops) {
    var w = state.world;
    Object.keys(ops || {}).forEach(function (n) {
      if (NET_NAMES.indexOf(n) < 0) return;
      var sn = netSnap[n] || (netSnap[n] = {});
      Object.keys(ops[n]).forEach(function (k) {
        var v = ops[n][k];
        if (n === 'nations') {
          if (!w.nations) w.nations = [];
          var i = +k; if (!(i >= 0 && i < 12)) return;
          while (w.nations.length <= i) w.nations.push({ civ: 1 });
          if (v !== null) { w.nations[i] = v; sn[k] = JSON.stringify(v); }
          return;
        }
        var tgt = w[n] || (w[n] = {});
        if (v === null) { delete tgt[k]; delete sn[k]; } else { tgt[k] = v; sn[k] = JSON.stringify(v); netApplyTile(n, k, v); }
      });
    });
    safeDirty = true; nationMarkAt = 0;
  }
  Net.getWorld = function () { var o = {}; NET_NAMES.forEach(function (n) { o[n] = netSrc(n); }); return o; };
  Net.onWorld = function (ops) { netApply(ops); };
  Net.onWorldFull = function (wd) {   // 入った直後: ホストの世界で置き換える(NPC・敵は次の段階までゲストでは動かさない)
    var w = state.world;
    ['placed', 'depleted', 'holes', 'culture'].forEach(function (n) { w[n] = {}; });
    w.npcs = [];
    netSnapReset();
    netApply(wd || {});
    Net.status = '世界を受け取った(建築・採取・国の発展が共有される)'; 
  };
  // ===== NPCと敵の共有(ホストが動かし、ゲストは見るだけ。ゲストの攻撃はホストに送る) =====
  var netSnapT = 0, netMetaT = 0, ACT_NAME = [null, 'craft', 'build', 'gather'];
  function netSnapSend(dt) {
    if (!(window.Net && Net.mode === 'host')) return;
    netSnapT -= dt; if (netSnapT > 0) return; netSnapT = 0.15;
    var o = {
      n: state.world.npcs.map(function (n) {
        var rt = n.rt || {};
        return [n.id, Math.round(n.x * 10) / 10, Math.round(n.y * 10) / 10, n.fx || 0, n.fy || 0, n.site, n.fam, n.born ? 1 : 0, (n.slave ? 1 : 0) | (n.pk ? 2 : 0) | (n.kin ? 4 : 0), n.partner, Math.round(typeof n.combatHp === 'number' ? n.combatHp : 100),
                (rt.sleeping ? 1 : 0) | (rt.moving ? 2 : 0) | (rt.down > 0 ? 4 : 0) | (rt.hurt > 0 ? 8 : 0) | ((rt.fearT > 0 || rt.label === 'flee') ? 16 : 0) | (n.sMode === 'collect' ? 32 : 0), rt.act === 'craft' ? 1 : (rt.act === 'build' ? 2 : (rt.act === 'gather' ? 3 : 0))];
      }),
      m: mutants.map(function (m) { return [m.id, Math.round(m.x * 10) / 10, Math.round(m.y * 10) / 10, m.fx, m.fy || 0, m.st, m.hp, m.maxHp, m.hurt > 0 ? 1 : 0, Math.round((m.fade || 0) * 10) / 10]; })
    };
    netMetaT -= 0.15; if (netMetaT <= 0) { netMetaT = 2; o.meta = { pc: profCache, es: state.world.extraSites || [] }; }
    Net.sendSnap(o);
  }
  Net.onSnap = function (m) {
    var w = state.world, byId = {}, list = [];
    if (m.meta) { profCache = m.meta.pc || {}; w.extraSites = m.meta.es || []; }
    w.npcs.forEach(function (n) { byId[n.id] = n; });
    (m.n || []).forEach(function (r) {
      var n = byId[r[0]];
      if (!n) { n = npcMake(r[0], r[5]); n.x = r[1]; n.y = r[2]; }
      n.tx = r[1]; n.ty = r[2]; n.fx = r[3]; n.fy = r[4]; n.site = r[5]; n.fam = r[6]; n.born = r[7]; n.slave = !!(r[8] & 1); n.pk = !!(r[8] & 2); n.kin = !!(r[8] & 4); n.partner = r[9]; n.combatHp = r[10];
      var g = r[11], rt = n.rt;
      rt.sleeping = !!(g & 1); rt.moving = !!(g & 2); rt.down = (g & 4) ? 1 : 0; rt.hurt = (g & 8) ? 0.2 : 0; rt.fearT = (g & 16) ? 1 : 0; n.sMode = (g & 32) ? 'collect' : 'follow'; rt.act = ACT_NAME[r[12]] || null;
      list.push(n);
    });
    w.npcs = list;
    var mb = {}; mutants.forEach(function (x) { mb[x.id] = x; });
    var ml = (m.m || []).map(function (r) {
      var x = mb[r[0]] || { id: r[0], x: r[1], y: r[2], cd: 1, wt: 0, wvx: 0, wvy: 0, lunged: false, rush: 0 };
      x.tx = r[1]; x.ty = r[2]; x.fx = r[3]; x.fy = r[4]; x.st = r[5]; x.hp = r[6]; x.maxHp = r[7]; x.hurt = r[8] ? 0.15 : 0; x.fade = r[9];
      return x;
    });
    mutants.length = 0; ml.forEach(function (x) { mutants.push(x); });
  };
  function netGuestSmooth(dt) {
    if (!netIsGuest()) return;
    var k = Math.min(1, dt * 14);
    state.world.npcs.forEach(function (n) { if (n.tx !== undefined) { n.x += (n.tx - n.x) * k; n.y += (n.ty - n.y) * k; } });
    mutants.forEach(function (x) { if (x.tx !== undefined) { x.x += (x.tx - x.x) * k; x.y += (x.ty - x.y) * k; } });
  }
  Net.onAct = function (m, slot, reply) {   // ゲストの攻撃: ホストが相手に当てる
    if (m.k === 'hm') {
      var mm = null; mutants.forEach(function (x) { if (x.id === m.id) mm = x; });
      if (!mm) return;
      var st = mm.st;
      if (damageMutant(mm, Math.max(0, Math.min(40, +m.dmg || 3)), +m.dx || 0, +m.dy || 0)) reply({ t: 'ev', k: 'mk', st: st });
    } else if (m.k === 'hn') {
      var n = npcById(m.id); if (!n || n.slave || n.born || n.pk || n.id === state.player.partnerId || n.partner === -2) return;
      var a = m.al || {}; if ((a.k === 'member' || a.k === 'exile') && a.v === npcHome(n).v) return;   // 自分の国の者には手を出せない
      n.combatHp = Math.max(0, n.combatHp - Math.max(0, Math.min(60, +m.dmg || 12)));
      n.rt.job = null; n.rt.act = null; n.rt.actT = 0; n.rt.pause = 1.5; n.rt.eatT = 0;
      spawnChips(n.x + 5, n.y + 5, 'mut', 5);
      if (n.combatHp <= 0) killNpc(n); else provoke(n, slot);
    }
  };
  Net.onEv = function (m) {   // ホストから: ダメージを受けた / 敵を倒して肉を得た
    if (m.k === 'dmg') { state.player.hp = Math.max(0, state.player.hp - (+m.v || 0)); hurtAt = Date.now(); Snd.sfx('hurt', 200); }
    else if (m.k === 'mk') meatDrop(m.st | 0);
  };
  function netWorldTick(dt) {
    netSnapSend(dt); netGuestSmooth(dt);
    if (!window.Net || Net.mode === 'solo') return;
    netDiffT -= dt; if (netDiffT > 0) return; netDiffT = 0.5;
    var ops = netDiff();
    if (ops) Net.sendWorld(ops);
  }
  Net.onChange(function () { if (Net.mode === 'host' && !netSnap.placed) netSnapReset(); });
  function loop(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    // 画面が止まっていた間(バックグラウンドなど)に経過した時間も生存値に反映する
    var wall = Date.now();
    var gap = (wall - lastWall) / 1000;
    lastWall = wall;
    if (gap > 1 && !inSafeZone()) elapseStats(state.player, gap - dt);   // 安全地域にいる間は保護(2-3)
    update(dt);
    runTickJobs();
    netWorldTick(dt);
    if (window.Net) Net.tick(dt, { x: player.x, y: player.y, fx: player.fx, fy: player.fy, mv: player.moving ? 1 : 0, col: armbandColor(), sf: (inSafeZone() || !!countryAt(playerTile().x, playerTile().y)) ? 1 : 0 });
    Snd.tick(dt, { night: isNightHour(daylightAt(wall).h), hour: daylightAt(wall).h, weather: weatherAt(wall).type, quiet: !!(deathFx.active || digestOpen), fire: h20Fire(), moving: !!player.moving && !deathFx.active });
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
// PWA: ホーム画面に追加できるようにする
(function () {
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
  var deferred = null, btn = null;
  function standalone() { return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone; }
  function mk(text, onclick) {
    if (btn || standalone()) return;
    btn = document.createElement('button');
    btn.textContent = text;
    btn.style.cssText = 'position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:99999;padding:10px 14px;background:rgba(9,17,13,.94);color:#7CFF9B;border:1px solid rgba(124,255,155,.7);border-radius:10px;font:14px sans-serif;';
    btn.onclick = onclick; document.body.appendChild(btn);
  }
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferred = e;
    mk('📲 アプリとして保存', function () { deferred.prompt(); deferred.userChoice.then(function () { deferred = null; if (btn) { btn.remove(); btn = null; } }); });
  });
  window.addEventListener('appinstalled', function () { if (btn) { btn.remove(); btn = null; } });
  var ua = navigator.userAgent;
  if (/iPhone|iPad|iPod/.test(ua) && !standalone()) {
    window.addEventListener('load', function () {
      setTimeout(function () {
        mk('📲 保存方法', function () { alert('Safariの共有ボタン(□↑)→「ホーム画面に追加」で、終末世界をアプリとして保存できます。'); });
        if (btn) setTimeout(function () { if (btn) { btn.remove(); btn = null; } }, 12000);
      }, 3000);
    });
  }
})();
</script>
