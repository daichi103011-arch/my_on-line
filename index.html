<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>終末世界</title>
<meta name="application-name" content="終末世界">
<meta name="theme-color" content="#14120f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="終末世界">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="終末世界サバイバル・文明再建ゲーム">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  /* ===== Phase 4-25: UI刷新 =====
     旧文明のPDA(蛍光グリーン・走査線)の世界観はそのまま、パネル・ボタン・文字の大きさと余白をそろえて見やすくした。
     色や角丸は :root の変数でそろえてある。(ゲームの動きは変えていない) */
  :root { --bg:#14120f; --pda-green:#7CFF9B; --pda-amber:#FFB000; --ink:#d9f7e1; --dim:#8db79a; --line:rgba(124,255,155,.28); --line-strong:rgba(124,255,155,.7);
          --panel:rgba(9,17,13,.84); --panel-solid:rgba(9,17,13,.94); --danger:#ff6b6b; --radius:10px;
          --scan:repeating-linear-gradient(0deg, rgba(0,0,0,.20) 0 1px, transparent 1px 3px);
          --ui:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
          --mono:ui-monospace,Menlo,Consolas,monospace;
          /* Phase 4-39-34: レイヤー(z-index)・文字・操作の大きさを1か所で決める */
          --z-fx:5; --z-hud:10; --z-stick:12; --z-ctl:20; --z-map:22; --z-bar:25; --z-menu:30; --z-sheet:35; --z-notice:38; --z-death:40; --z-modal:50;
          --fs-s:12px; --fs-m:13px; --fs-l:15px; --h-ctl:44px; --gap:8px;
          --sa-t:env(safe-area-inset-top,0px); --sa-b:env(safe-area-inset-bottom,0px); --sa-l:env(safe-area-inset-left,0px); --sa-r:env(safe-area-inset-right,0px);
          box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#14120f; } }
  :root[data-theme="dark"] { --bg:#14120f; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); display:flex; align-items:center; justify-content:center; overflow:hidden; font-family:var(--ui); }
  canvas { image-rendering:pixelated; image-rendering:crisp-edges; display:block; }
  html, body { touch-action:none; overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .px { width:24px; height:24px; image-rendering:pixelated; image-rendering:crisp-edges; display:block; flex:none; pointer-events:none; }
  .px.s { width:12px; height:12px; }
  svg.ic { width:1em; height:1em; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  svg.ic.sol { fill:currentColor; stroke:none; }

  /* --- 共通のパネルとボタン --- */
  #hud, #menu, #placeBar, #npcBar, #chestBar, #boneBar { background:var(--scan), var(--panel); border:1px solid var(--line); border-radius:var(--radius);
        box-shadow:0 6px 20px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.03); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); color:var(--ink); font:13px/1.5 var(--ui); }
  #npcBar button, #chestBar button, #boneBar button, #rotBtn, #placeCancel {
        min-height:var(--h-ctl); padding:8px 14px; font:600 13px/1.2 var(--ui); color:var(--ink); background:rgba(124,255,155,.14); border:1px solid var(--line-strong);
        border-radius:8px; cursor:pointer; transition:background .12s, transform .12s; }
  #npcBar button:active, #chestBar button:active, #boneBar button:active, #rotBtn:active { background:rgba(124,255,155,.42); transform:scale(.97); }
  #placeCancel { color:#ffd6d6; background:rgba(230,57,70,.2); border-color:rgba(255,107,107,.7); }
  #placeCancel:active { background:rgba(230,57,70,.5); transform:scale(.97); }
  #rotBtn { display:none; }

  #soundBtn { position:fixed; z-index:var(--z-ctl); top:calc(var(--sa-t) + 8px); right:calc(var(--sa-r) + 8px); min-height:34px; padding:5px 9px; border:1px solid rgba(255,210,120,.55); border-radius:8px; color:#ffe6a6; background:rgba(15,13,12,.78); font:700 11px/1 var(--ui); box-shadow:0 3px 10px rgba(0,0,0,.35); }
  #soundBtn[aria-pressed="false"] { color:#a9aaa5; border-color:rgba(180,180,180,.35); }
  /* --- HUD(体力・空腹・渇き) --- */
  #civHud { position:fixed; z-index:var(--z-hud); top:calc(var(--sa-t) + 8px); right:calc(var(--sa-r) + 8px); max-width:210px; box-sizing:border-box; padding:7px 9px; display:none; pointer-events:none; color:var(--ink); background:rgba(9,17,13,.66); border:1px solid rgba(217,201,163,.28); border-radius:8px; font:700 12px/1.45 var(--ui); text-shadow:0 1px 2px #000; white-space:pre-line; }
  #civHud .cb { height:6px; margin:3px 0 2px; background:rgba(0,0,0,.6); border:1px solid rgba(255,210,74,.4); border-radius:3px; overflow:hidden; }
  #civHud .cb i { display:block; height:100%; background:linear-gradient(90deg,#d99a2f,#ffd24a); }
  #civHud { right:calc(var(--sa-r) + 38px); max-width:236px; padding:8px 10px; font-size:12px; white-space:normal; }
  #civHud .t { font-size:14px; color:#fff0c8; }
  #civHud .pips { margin:3px 0 4px; display:flex; flex-wrap:wrap; gap:3px; }
  #civHud .pp { display:inline-block; width:20px; height:16px; line-height:16px; text-align:center; font-size:11px; border-radius:3px; background:rgba(0,0,0,.55); border:1px solid rgba(255,210,74,.35); color:#9a8f78; }
  #civHud .pp.on { background:#d99a2f; border-color:#ffd24a; color:#2a1c06; }
  #civHud .nx { color:#cfd8c0; font-weight:600; margin-bottom:2px; }
  #civHud .goal { margin-top:6px; padding:5px 7px; border-radius:6px; background:rgba(255,210,74,.14); border:1px solid rgba(255,210,74,.55); color:#fff3c4; }
  #civHud .goal .gh { display:block; color:#ffd24a; font-size:11px; }
  #civHud .goal .gd { color:#ffd24a; white-space:nowrap; }
  #civHud .goal .gs { display:block; margin-top:2px; font-weight:500; font-size:11px; color:#d9d2bd; }
  #civHud.compact .nx, #civHud.compact .ok, #civHud.compact .ng, #civHud.compact .cb, #civHud.compact .gs { display:none; }
  #civHud.compact { padding:6px 9px; } #civHud.compact .goal { margin-top:4px; }
  #civHud .ok { color:#8fe08f; } #civHud .ng { color:#ffb0a0; } #civHud .me { color:#ffd24a; }
  #hud { position:fixed; z-index:var(--z-hud); top:calc(var(--sa-t) + 8px); left:calc(var(--sa-l) + 8px); pointer-events:none; padding:8px 10px; transition:opacity .6s; font:12px/1 var(--mono); }
  #hud .row { display:flex; align-items:center; gap:7px; margin-bottom:6px; }
  #hud .row:nth-child(3) { margin-bottom:5px; }
  #worldHud { display:flex; align-items:center; gap:3px; min-height:18px; padding:4px 6px; box-sizing:border-box; color:var(--ink); background:rgba(9,17,13,.62); border:1px solid rgba(217,201,163,.22); border-radius:6px; font:700 12px/1 var(--ui); letter-spacing:.03em; text-shadow:0 1px 2px #000; }
  #worldHud .sep { color:var(--dim); }
  #hud .lbl { width:2.4em; color:var(--dim); letter-spacing:.04em; }
  #hud .bar { width:76px; height:8px; background:rgba(0,0,0,.6); border:1px solid rgba(124,255,155,.35); border-radius:4px; overflow:hidden; }
  #hud .fill { height:100%; width:100%; border-radius:3px; box-shadow:inset 0 1px 0 rgba(255,255,255,.28); transition:width .25s; }
  #hud .val { width:2.2em; text-align:right; color:var(--ink); }
  #hud .row.low .val { color:var(--danger); }
  #hud .row.low .bar { border-color:rgba(255,107,107,.8); animation:lowPulse 1s ease-in-out infinite; }
  @keyframes lowPulse { 50% { box-shadow:0 0 6px rgba(255,107,107,.8); } }
  #hud .warn { display:none; margin-top:8px; padding-top:6px; border-top:1px solid var(--line); color:var(--pda-amber); font:12px/1.5 var(--ui); text-shadow:0 0 2px #000; }

  /* --- 右下のアクションボタン --- */
  #menuBtn { position:fixed; z-index:var(--z-ctl); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; cursor:pointer; color:var(--ink); font:700 11px/1 var(--ui);
                      -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:none; transition:transform .1s, background .12s, box-shadow .12s; }
  #menuBtn { right:calc(var(--sa-r) + 12px); bottom:calc(var(--sa-b) + 12px); width:58px; height:58px; font-size:12px; border-radius:16px;
             background:var(--scan), var(--panel-solid); border:1px solid var(--line-strong); box-shadow:0 4px 14px rgba(0,0,0,.5); }
  #menuBtn:active { transform:scale(.94); background:rgba(124,255,155,.3); }
  /* Phase 4-39-34: 右下の丸い「叩く」ボタンは廃止。操作は右端スワイプの「操作を選ぶ」(#actSheet)へ */
  /* --- 左下の簡易マップ(Phase 4-30) --- */
  #mapBtn { position:fixed; z-index:var(--z-ctl); left:calc(var(--sa-l) + 12px); bottom:calc(var(--sa-b) + 12px); width:52px; height:52px; border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; cursor:pointer;
            color:var(--ink); font:700 12px/1 var(--ui); background:var(--scan), var(--panel-solid); border:1px solid var(--line-strong); box-shadow:0 4px 14px rgba(0,0,0,.5);
            -webkit-tap-highlight-color:transparent; touch-action:none; transition:transform .1s, background .12s; }
  #mapBtn:active { transform:scale(.94); background:rgba(124,255,155,.3); }
  #mapBtn.on { background:rgba(124,255,155,.22); border-color:var(--pda-green); }
  #mapBox { position:fixed; z-index:var(--z-map); left:calc(var(--sa-l) + 12px); bottom:calc(var(--sa-b) + 72px); display:none; padding:6px; background:var(--scan), var(--panel); border:1px solid var(--line); border-radius:var(--radius);
            box-shadow:0 6px 20px rgba(0,0,0,.45); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
  #mapCv { display:block; width:min(204px, 56vw); height:auto; image-rendering:auto; border-radius:6px; }

  /* --- メニュー(持ち物・作る・情報) --- */
  #menu { position:fixed; z-index:var(--z-menu); right:calc(var(--sa-r) + 12px); bottom:calc(var(--sa-b) + 84px); display:none; width:min(300px, calc(100vw - 24px)); max-height:calc(100vh - 215px); max-height:calc(100dvh - 215px - var(--sa-b) - var(--sa-t));
          overscroll-behavior:contain;
          overflow-y:auto; touch-action:pan-y; box-sizing:border-box; padding:10px; background:var(--scan), var(--panel-solid); }
  #menu::-webkit-scrollbar { width:6px; } #menu::-webkit-scrollbar-thumb { background:rgba(124,255,155,.3); border-radius:3px; }
  #menu .tabs { display:flex; gap:2px; padding:3px; margin-bottom:10px; background:rgba(0,0,0,.4); border-radius:9px; }
  #menu .tab { flex:1; min-height:var(--h-ctl); padding:8px 4px; font:700 13px/1 var(--ui); color:var(--dim); background:transparent; border:0; border-radius:7px; cursor:pointer; transition:background .12s,color .12s; }
  #menu .tab.on { background:var(--pda-green); color:#06210f; }
  #menu .empty { color:var(--dim); padding:14px 4px; text-align:center; }
  #menu .inv { white-space:normal; }
  #menu .inv .item { display:flex; align-items:center; gap:9px; min-height:var(--h-ctl); padding:8px 10px; margin-bottom:5px; border:1px solid var(--line); border-radius:9px; background:rgba(255,255,255,.03); }
  #menu .inv .item .px { background:rgba(0,0,0,.3); border-radius:6px; padding:3px; box-sizing:content-box; }
  #menu .inv .item.on { border-color:var(--pda-amber); background:rgba(255,176,0,.10); }
  #menu .inv .item .act.eq { color:#2a1802; background:var(--pda-amber); }
  #menu .inv .item .nm { flex:1; font-weight:600; }
  #menu .inv .item .ct { font:700 12px/1 var(--mono); color:var(--pda-green); background:rgba(0,0,0,.4); padding:3px 7px; border-radius:6px; }
  #menu .inv .item .act { font:700 12px/1 var(--ui); color:#06210f; background:var(--pda-green); padding:6px 9px; border-radius:6px; }
  #menu .inv .item.edible { cursor:pointer; background:rgba(124,255,155,.10); border-color:var(--line-strong); transition:background .12s, transform .12s; }
  #menu .inv .item.edible:active { background:rgba(124,255,155,.38); transform:scale(.98); }
  #menu .inv .cathd { margin:8px 0 5px; padding:12px 10px; min-height:var(--h-ctl); box-sizing:border-box; cursor:pointer; color:var(--pda-amber); font:700 13px/1 var(--ui); background:rgba(255,176,0,.08); border:1px solid rgba(255,176,0,.35); border-radius:9px; }
  #menu .inv .cathd:active { background:rgba(255,176,0,.25); }
  #paneInfo { display:none; white-space:pre-line; line-height:1.65; font-size:13px; }
  #paneInfo > div { padding:7px 2px; border-bottom:1px solid rgba(124,255,155,.12); }
  #paneInfo > div:last-child { border-bottom:0; }
  #paneInfo .k { display:block; margin-bottom:1px; color:var(--pda-amber); font:700 12px/1.4 var(--ui); letter-spacing:.04em; }
  /* Phase 4-39-33: 「作る」画面のデザイン刷新(PDA風はそのまま。カード・材料チップ・ゲージ・分類見出し) */
  #craftPanel { display:none; }
  #craftPanel .title { display:none; }
  #craftPanel img.px { image-rendering:pixelated; image-rendering:crisp-edges; }
  #craftPanel .heads { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:8px; }
  #craftPanel .hd { padding:8px 9px 9px; border:1px solid rgba(255,176,0,.35); border-radius:9px; background:rgba(255,176,0,.08); }
  #craftPanel .hd.civ { border-color:rgba(124,255,155,.35); background:rgba(124,255,155,.07); }
  #craftPanel .hd .t { display:flex; justify-content:space-between; align-items:baseline; font:700 12px/1 var(--ui); color:var(--dim); letter-spacing:.04em; }
  #craftPanel .hd .v { margin-top:5px; font:800 15px/1 var(--ui); color:var(--pda-amber); }
  #craftPanel .hd.civ .v { color:var(--pda-green); }
  #craftPanel .hd .v small { font:700 12px/1 var(--ui); color:var(--dim); margin-left:4px; }
  #craftPanel .bar { height:5px; margin-top:7px; border-radius:3px; background:rgba(0,0,0,.45); overflow:hidden; }
  #craftPanel .bar i { display:block; height:100%; border-radius:3px; background:var(--pda-amber); }
  #craftPanel .hd.civ .bar i { background:var(--pda-green); }
  #craftPanel .civnext { margin:-2px 2px 8px; font-size:12px; color:var(--dim); white-space:normal; }
  #craftPanel .filters { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:0 0 6px; }
  #craftPanel .filters .cnt { margin-left:auto; font:700 12px/1 var(--ui); color:var(--dim); }
  #craftPanel .cfilter, #craftPanel .ccat { display:inline-flex; align-items:center; min-height:40px; box-sizing:border-box; padding:0 13px; font:700 12px/1 var(--ui); color:var(--dim); border:1px solid var(--line); border-radius:99px; cursor:pointer; background:rgba(0,0,0,.25); }
  #craftPanel .cfilter.on, #craftPanel .ccat.on { color:#06210f; background:var(--pda-green); border-color:var(--pda-green); }
  #craftPanel .sec { display:flex; align-items:center; gap:8px; margin:12px 2px 6px; font:800 12px/1 var(--ui); color:var(--pda-amber); letter-spacing:.08em; }
  #craftPanel .sec::after { content:''; flex:1; height:1px; background:linear-gradient(90deg, rgba(255,176,0,.45), transparent); }
  #craftPanel .sec.civ { color:var(--pda-green); } #craftPanel .sec.civ::after { background:linear-gradient(90deg, rgba(124,255,155,.45), transparent); }
  #craftPanel .craft-row { position:relative; display:flex; align-items:center; gap:10px; min-height:var(--h-ctl); padding:9px 10px 9px 12px; margin-bottom:6px; border:1px solid var(--line-strong); border-radius:11px; overflow:hidden;
                           background:linear-gradient(100deg, rgba(124,255,155,.16), rgba(124,255,155,.05)); cursor:pointer; white-space:normal; transition:background .12s, transform .12s, box-shadow .12s; box-shadow:0 0 10px rgba(124,255,155,.10); }
  #craftPanel .craft-row::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--pda-green); }
  #craftPanel .craft-row .tile { flex:none; display:flex; align-items:center; justify-content:center; width:46px; height:46px; border-radius:9px; background:rgba(0,0,0,.42); border:1px solid rgba(124,255,155,.35); }
  #craftPanel .craft-row .tile img { width:36px; height:36px; }
  #craftPanel .craft-row .tile .sw { width:22px; height:22px; border-radius:5px; border:2px solid rgba(0,0,0,.5); }
  #craftPanel .craft-row .body { flex:1; min-width:0; }
  #craftPanel .craft-row .gv { display:flex; align-items:baseline; gap:6px; font:800 14px/1.2 var(--ui); color:var(--ink); }
  #craftPanel .craft-row .gv em { font:800 11px/1 var(--mono); font-style:normal; color:var(--pda-green); }
  #craftPanel .chips { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
  #craftPanel .chip { display:inline-flex; align-items:center; gap:4px; padding:2px 6px 2px 3px; border-radius:6px; background:rgba(0,0,0,.4); border:1px solid rgba(124,255,155,.25); font:700 11px/1.1 var(--mono); color:var(--pda-green); }
  #craftPanel .chip img { width:12px; height:12px; } #craftPanel .chip .sw { width:10px; height:10px; border-radius:2px; margin:0 1px; border:1px solid rgba(0,0,0,.5); }
  #craftPanel .chip.short { color:var(--danger); border-color:rgba(255,107,107,.45); }
  #craftPanel .craft-row .go { flex:none; padding:12px 12px; border-radius:7px; font:800 13px/1 var(--ui); color:#06210f; background:var(--pda-green); letter-spacing:.06em; }
  #craftPanel .craft-row .lk { margin-top:6px; font:700 12px/1.3 var(--ui); color:var(--pda-amber); }
  #craftPanel .craft-row.off { cursor:default; border-color:var(--line); background:rgba(255,255,255,.025); box-shadow:none; }
  #craftPanel .craft-row.off::before { background:rgba(255,255,255,.12); }
  #craftPanel .craft-row.off .tile { opacity:.5; filter:grayscale(.5); border-color:var(--line); }
  #craftPanel .craft-row.off .gv { color:var(--dim); } #craftPanel .craft-row.off .gv em { color:var(--dim); }
  #craftPanel .craft-row:not(.off):active { background:rgba(124,255,155,.38); transform:scale(.98); }
  #craftPanel .craft-row.pop { animation:craftpop .5s ease-out; }
  @keyframes craftpop { 0% { box-shadow:0 0 0 0 rgba(124,255,155,.9); background:rgba(124,255,155,.55); } 100% { box-shadow:0 0 0 14px rgba(124,255,155,0); } }
  #craftPanel .none { padding:18px 6px; text-align:center; color:var(--dim); }

  /* --- 画面下のパネル(置く・NPC・倉庫) --- */
  #placeBar, #npcBar, #chestBar, #boneBar { position:fixed; z-index:var(--z-bar); left:50%; transform:translateX(-50%); display:none; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center;
                                  width:max-content; box-sizing:border-box; padding:9px 12px; }
  #placeBar { bottom:calc(var(--sa-b) + 14px); max-width:calc(100vw - 160px); }
  #npcBar, #chestBar, #boneBar { bottom:calc(var(--sa-b) + 84px); max-width:calc(100vw - 16px); max-height:calc(100vh - 200px); max-height:calc(100dvh - 200px - var(--sa-t)); overflow-y:auto; overscroll-behavior:contain; touch-action:pan-y; }
  #placeMsg, #npcMsg, #chestMsg, #boneMsg { white-space:pre-line; font-weight:600; }
  #chestMsg { color:var(--pda-amber); }
  /* --- 倉庫(Phase 5-6): 左に持ち物・右に倉庫の2列。個数(1 / 10 / 全部)を選んで出し入れする --- */
  #chestBar { flex-direction:column; align-items:stretch; flex-wrap:nowrap; justify-content:flex-start; gap:8px; width:min(560px, calc(100vw - 16px)); padding:10px; overflow:hidden; }
  #chestBar .chHead { display:flex; align-items:center; gap:10px; }
  #chestBar #chestMsg { font:800 15px/1 var(--ui); letter-spacing:.08em; }
  #chestBar #chestSum { flex:1; min-width:0; font:700 12px/1.3 var(--ui); color:var(--dim); }
